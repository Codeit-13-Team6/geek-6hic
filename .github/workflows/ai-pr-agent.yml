name: AI PR Agent (Free Forever)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # PR 작성자가 bot이 아닐 때만 실행 (무한 루프 방지)
    if: ${{ github.event.issue.pull_request || github.event.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          # 핵심 설정: Gemini 무료 모델 사용
          OPENAI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL_RESOURCES__DEFAULT__MODEL: "gemini/gemini-1.5-flash"

          PR_DESCRIPTION.EXTRA_INSTRUCTIONS: |
            반드시 '한국어' 구어체(~했습니다)로 작성하세요.
            1. AI 서명 제거.
            2. 변경 사항 요약 후 '### ⚡ Tech Stack & Patterns' 섹션에 체크박스 직접 생성.
               - Architecture, Naming, Styling, URL 규칙 준수 여부 체크.
            3. 마지막에 Mermaid 다이어그램 추가.

          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            [CRITICAL] 반드시 '한국어'로만 대답하세요.
            1. 200줄 이상 컴포넌트 분리 잔소리 금지.
            2. [위험도: 높음/중간/낮음] 표시 필수.
            3. 컨벤션 위반은 '🎨 컨벤션 위반' 카테고리로 묶기.

          # 자동 실행 설정
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: false
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: false
