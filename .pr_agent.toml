[config]
model = "llama3-70b-8192"
language = "Korean"

[pr_description]
publish_description_as_comment = false
use_description_markers = true
add_line_break_after_description = false

extra_instructions = """
반드시 다음 지침을 지켜서 '한국어'로 작성하세요:

1. **출력 형식 제어 (매우 중요)**: 
   - 내용 상단에 '🤖 Generated by PR Agent...' 같은 AI 서명이나 커밋 해시를 **절대** 포함하지 마세요.
   - 불필요한 제목(예: '## PR 설명') 없이 바로 본문 내용(-)으로 시작하세요.
2. **변경 사항 요약**: 
   - '무엇이 왜 바뀌었는지' 기능 중심으로 구어체(~했습니다, ~추가했습니다)로 친절하게 설명하세요.
3. **로직 다이어그램 추가**:
   - 텍스트 요약 아래에, 변경된 코드의 흐름이나 컴포넌트 구조를 보여주는 간단한 다이어그램을 Mermaid 문법(```mermaid)을 사용하여 그려주세요.
"""

[pr_reviewer]
extra_instructions = """
리뷰 내용을 작성할 때 가독성을 위해 다음 형식을 지키세요:
1. 반드시 '한국어'로 작성하세요.
2. 발견된 문제점은 [위험도: 높음/중간/낮음] 식으로 머릿말을 붙이세요.
3. 'Description' 부분은 한두 문장으로 짧고 명확하게 요약하세요.
4. 'Suggested fix'는 코드 블록(```)을 사용하여 복사 붙여넣기가 가능하게 제공하세요.
5. 긱시크 팀 컨벤션(is/has/can, List 접미사, Btn- 접두사) 위반은 '🎨 컨벤션 위반' 카테고리로 묶어서 보여주세요.
"""