[config]
model = "llama3-70b-8192"
language = "ko-KR"

[pr_description]
publish_description_as_comment = false
use_description_markers = true
add_line_break_after_description = false

extra_instructions = """
반드시 다음 지침을 지켜서 '한국어'로 작성하세요:

1. **AI 서명 제거**: '🤖 Generated by...' 같은 서명은 절대 넣지 마세요.
2. **변경 사항 요약**: '무엇이 왜 바뀌었는지' 구어체(~했습니다)로 요약하세요.
3. **체크박스 자동 생성 및 체크 (매우 중요)**:
   - 요약 내용 바로 아래에 `### ⚡ Tech Stack & Patterns` 라는 제목을 만드세요.
   - 이번 PR 코드를 분석해서 아래 4가지 항목이 지켜졌으면 `- [x]`, 아니면 `- [ ]` 로 체크박스 리스트를 직접 작성하세요.
     * Architecture: Function Declaration & Named Export 준수
     * Naming: camelCase, Btn- prefix, artistList 형식 준수
     * Styling: Semantic Tag 사용
     * URL: RESTful 구조 및 Lowercase 경로 확인
4. **로직 다이어그램**: 마지막에 Mermaid 문법(```mermaid)으로 코드 구조 다이어그램을 그리세요.
"""

[pr_reviewer]
extra_instructions = """
[VERY IMPORTANT / 최우선 지시사항]
1. ALL RESPONSES MUST BE IN KOREAN. (모든 리뷰는 무조건 '한국어'로만 작성하세요. 절대 영어를 쓰지 마세요.)
2. 발견된 문제점의 제목 앞에는 반드시 [위험도: 높음], [위험도: 중간], [위험도: 낮음] 중 하나를 붙이세요.
3. 'Description' 내용은 개발자가 바로 이해할 수 있도록 1~2문장으로 아주 짧고 명확하게 요약하세요.
4. 'Suggested fix' (수정 제안) 파트에서는 반드시 마크다운 코드 블록(```)을 사용하여 복붙 가능한 코드를 제공하세요.
5. 변수명(Naming), 폴더 구조, 태그 등 '긱시크 팀 컨벤션'을 위반한 사항은 무조건 '🎨 컨벤션 위반' 이라는 카테고리로 묶어서 따로 보여주세요.
이 지시사항을 어길 시 리뷰는 실패한 것으로 간주합니다.
"""