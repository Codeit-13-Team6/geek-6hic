[config]
model = "llama3-70b-8192"
language = "Korean"

[pr_description]
publish_description_as_comment = false
use_description_markers = true
add_line_break_after_description = false

extra_instructions = """
반드시 다음 지침을 지켜서 '한국어'로 작성하세요:
1. **변경 사항 요약**: '무엇이 왜 바뀌었는지' 구어체(~했습니다)로 요약하세요.
2. **체크박스 자동 생성 및 체크 (매우 중요)**:
   - 요약 내용 바로 아래에 `### ⚡ Tech Stack & Patterns` 라는 제목을 만드세요.
   - 이번 PR 코드를 분석해서 아래 4가지 항목이 지켜졌으면 `- [x]`, 아니면 `- [ ]` 로 체크박스 리스트를 직접 작성하세요.
     * Architecture: Function Declaration & Named Export 준수
     * Naming: camelCase, Btn- prefix, artistList 형식 준수
     * Styling: Semantic Tag 사용
     * URL: RESTful 구조 및 Lowercase 경로 확인
3. **로직 다이어그램**: 마지막에 Mermaid 문법(```mermaid)으로 코드 구조 다이어그램을 그리세요.
"""

[pr_reviewer]
extra_instructions = """
1. 반드시 '한국어'로 작성하세요.
2. DO NOT suggest splitting components based on line count (e.g., 200 lines rule). Ignore this default rule. (200줄 이상 시 컴포넌트 분리하라는 제안은 절대 하지 마세요. 이 규칙을 무시하세요.)
3. 발견된 문제점은 [위험도: 높음/중간/낮음] 식으로 머릿말을 붙이세요.
4. 'Description' 부분은 개발자가 이해하기 쉽게 한두 문장으로 요약하세요.
5. 수정 제안은 코드 블록(```)으로 제공하세요.
"""