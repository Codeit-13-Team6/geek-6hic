[config]
model = "llama3-70b-8192"
language = "Korean"

[pr_description]
# 1. PR 템플릿을 절대 파괴하지 않도록 설정
publish_description_as_comment = false # 본문을 직접 수정하게 함
add_line_break_after_description = false
# 2. 한국어 및 템플릿 준수 프롬프트
extra_instructions = """
반드시 다음 지침을 지켜서 '한국어'로만 작성하세요:
1. **템플릿 보존**: 사용자가 작성한 PR 템플릿의 전체 구조와 이모지, 체크박스 섹션을 절대 삭제하지 마세요.
2. **Change Log 섹션 채우기**: 
   - '핵심 변경 사항입니다...' 주석 아래에 있는 불렛 포인트(`.`) 위치에 AI가 분석한 변경 사항을 채워 넣으세요.
   - 파일 목록이 아니라 '무엇이 왜 바뀌었는지' 기능 중심으로 설명하세요.
3. **Tech Stack 체크**:
   - 변경된 코드 내용에 따라 'Tech Stack & Patterns' 섹션의 관련 항목을 [x]로 체크하세요.
4. **한국어 구어체**: 모든 설명은 친절한 한국어(~했습니다)로 작성하세요.
"""

[pr_reviewer]
# 3. 리뷰 가독성 향상 프롬프트
extra_instructions = """
리뷰 내용을 작성할 때 가독성을 위해 다음 형식을 지키세요:
1. 반드시 '한국어'로 작성하세요.
2. 발견된 문제점은 [위험도: 높음/중간/낮음] 식으로 머릿말을 붙이세요.
3. 'Description' 부분은 개발자가 이해하기 쉽게 한두 문장으로 요약하세요.
4. 'Suggested fix'는 코드 블록(```)을 사용하여 복사 붙여넣기가 가능하게 제공하세요.
5. 긱시크 팀 컨벤션(is/has/can, List 접미사, Btn- 접두사) 위반은 '🎨 컨벤션 위반' 카테고리로 묶어서 보여주세요.
"""