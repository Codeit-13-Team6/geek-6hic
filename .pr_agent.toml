[config]
model = "llama3-70b-8192"
language = "Korean"

[pr_description]
# 1. PR 템플릿을 절대 파괴하지 않도록 설정
publish_description_as_comment = false # 본문을 직접 수정하게 함
add_line_break_after_description = false
# 2. 한국어 및 템플릿 준수 프롬프트
extra_instructions = """
반드시 다음 지침을 지켜서 '한국어'로만 작성하세요:
1. 사용자가 이미 작성한 PR 템플릿의 구조(Issue Number, Change Log 등)를 '절대' 지우지 마세요.
2. 각 섹션의 주석(예: '핵심 변경 사항입니다...') 바로 아래에 내용을 채워 넣으세요.
3. 'Change Log' 섹션에는 변경된 파일 목록이 아니라, '어떤 기능적 변화'가 있는지 요약해서 적으세요.
4. 모든 문장은 문어체(~함, ~임)가 아닌 구어체(~했습니다, ~하세요)를 적절히 섞어 친절하게 작성하세요.
"""

[pr_reviewer]
# 3. 리뷰 가독성 향상 프롬프트
extra_instructions = """
리뷰 내용을 작성할 때 가독성을 위해 다음 형식을 지키세요:
1. 반드시 '한국어'로 작성하세요.
2. 발견된 문제점은 [위험도: 높음/중간/낮음] 식으로 머릿말을 붙이세요.
3. 'Description' 부분은 개발자가 이해하기 쉽게 한두 문장으로 요약하세요.
4. 'Suggested fix'는 코드 블록(```)을 사용하여 복사 붙여넣기가 가능하게 제공하세요.
5. 긱시크 팀 컨벤션(is/has/can, List 접미사, Btn- 접두사) 위반은 '🎨 컨벤션 위반' 카테고리로 묶어서 보여주세요.
"""