[config]
model = "llama3-70b-8192"
language = "ko-KR"

[pr_description]
publish_description_as_comment = false
use_description_markers = true
add_line_break_after_description = false

extra_instructions = """
반드시 다음 지침을 지켜서 '한국어'로 작성하세요:

1. **AI 서명 제거**: '🤖 Generated by...' 같은 서명은 절대 넣지 마세요.
2. **변경 사항 요약**: '무엇이 왜 바뀌었는지' 구어체(~했습니다)로 요약하세요.
3. **체크박스 자동 생성 및 체크 (매우 중요)**:
   - 요약 내용 바로 아래에 `### ⚡ Tech Stack & Patterns` 라는 제목을 만드세요.
   - 이번 PR 코드를 분석해서 아래 4가지 항목이 지켜졌으면 `- [x]`, 아니면 `- [ ]` 로 체크박스 리스트를 직접 작성하세요.
     * Architecture: Function Declaration & Named Export 준수
     * Naming: camelCase, Btn- prefix, artistList 형식 준수
     * Styling: Semantic Tag 사용
     * URL: RESTful 구조 및 Lowercase 경로 확인
4. **로직 다이어그램**: 마지막에 Mermaid 문법(```mermaid)으로 코드 구조 다이어그램을 그리세요.
"""

[pr_reviewer]
extra_instructions = """
CRITICAL REQUIREMENTS (You MUST follow these strictly):
1. OUTPUT LANGUAGE: The ENTIRE review MUST be written in Korean (한국어로 작성). Do NOT output in English.
2. RISK LEVEL: You MUST prefix EVERY issue title with exactly one of these: [위험도: 높음], [위험도: 중간], or [위험도: 낮음].
3. CONVENTION CATEGORY: Any issue related to Naming conventions, folder structures, or HTML tags MUST be categorized strictly under "🎨 컨벤션 위반".
4. DESCRIPTION: Keep the description extremely short (1-2 sentences).
5. SUGGESTED FIX: You MUST provide a markdown code block (```) for all suggested fixes.
"""